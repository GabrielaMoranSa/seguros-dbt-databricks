name: dbt

on:
  pull_request:
    branches: [main]

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/pr/.github/dbt
      DATABRICKS_SERVER_HOSTNAME: ${{ secrets.DATABRICKS_SERVER_HOSTNAME }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - name: El código del PR
        uses: actions/checkout@v4
        with:
          path: pr

      - name: El código de main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pr/requirements.txt

      - name: Instalar dependencias
        run: pip install -r pr/requirements.txt

      - name: El plano de main
        working-directory: main/seguros
        run: |
          dbt deps
          dbt parse --target prod --target-path ${{ github.workspace }}/estado_main

      - name: Construir solo lo que cambia y lo que cuelga de ello
        working-directory: pr/seguros
        run: |
          dbt deps
          dbt build --target ci --select state:modified+ --defer --favor-state --state ${{ github.workspace }}/estado_main
