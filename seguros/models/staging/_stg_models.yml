version: 2

models:
  - name: stg_polizas
    columns:
      - name: poliza_id
        data_tests: [unique, not_null]
      - name: region
        data_tests:
          - relationships:
              arguments:
                to: ref('regiones')
                field: codigo_region
  - name: stg_siniestros
    columns:
      - name: siniestro_id
        data_tests: [unique, not_null]
      - name: poliza_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_polizas')
                field: poliza_id
              config:
                severity: warn
  - name: stg_mov_polizas
    columns:
      - name: movimiento_id
        data_tests: [unique, not_null]
      - name: poliza_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_polizas')
                field: poliza_id
      - name: tipo_movimiento
        data_tests:
          - accepted_values:
              arguments:
                values: ['ALTA', 'SUPLEMENTO', 'ANULACION', 'REHABILITACION']
  - name: stg_mov_siniestros
    columns:
      - name: movimiento_id
        data_tests: [unique, not_null]
      - name: poliza_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_polizas')
                field: poliza_id
      - name: tipo_movimiento
        data_tests:
          - accepted_values:
              arguments:
                values: ['APERTURA', 'AJUSTE_RESERVA', 'PAGO', 'CIERRE']
            