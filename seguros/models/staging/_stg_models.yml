version: 2

models:
  - name: stg_polizas
    columns:
      - name: poliza_id
        data_tests: [unique, not_null]
      - name: region
        data_tests:
          - relationships:
              arguments:
                to: ref('regiones')
                field: codigo_region
  - name: stg_siniestros
    columns:
      - name: siniestro_id
        data_tests: [unique, not_null]
      - name: poliza_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_polizas')
                field: poliza_id
              config:
                severity: error
                error_if: ">195"
                warn_if: ">0"
  - name: stg_mov_polizas
    description: "Staging of raw.mov_polizas: renamed columns and fixed types. One row per policy movement. Same movement types as the source"
    columns:
      - name: movimiento_id
        data_tests: [unique, not_null]
      - name: poliza_id
        data_tests: 
          - not_null
          - relationships:
              arguments:
                to: ref('stg_polizas')
                field: poliza_id
      - name: tipo_movimiento
        data_tests:
          - accepted_values:
              arguments:
                values: ['ALTA', 'SUPLEMENTO', 'ANULACION', 'REHABILITACION']
  - name: stg_mov_siniestros
    description: "Staging of raw.mov_siniestros: renamed columns and fixed types. One row per claim movement. Same movement types as the source"
    columns:
      - name: movimiento_id
        data_tests: [unique, not_null]
      - name: poliza_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_polizas')
                field: poliza_id
      - name: tipo_movimiento
        data_tests:
          - accepted_values:
              arguments:
                values: ['APERTURA', 'AJUSTE_RESERVA', 'PAGO', 'CIERRE']
      - name: siniestro_id
        data_tests: [not_null]
            