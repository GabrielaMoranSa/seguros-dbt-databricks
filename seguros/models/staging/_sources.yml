version: 2

sources:
  - name: raw
    database: workspace
    schema: raw
    tables:
      - name: fremtpl2_freq
        config: 
          freshness: null
        columns:
          - name: IDpol
            data_tests:
              - unique
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'fremtpl2_sev')
                    field: IDpol
                  config:
                    where: "ClaimNb > 0"
                    severity: error
                    error_if: ">9116"
                    warn_if: ">0"
      - name: fremtpl2_sev
        config: 
          freshness: null
        columns:
          - name: IDpol
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'fremtpl2_freq')
                    field: IDpol
                  config:
                    severity: error
                    error_if: ">195"
                    warn_if: ">0"
      - name: mov_polizas
        description: "Daily batches of generated policy movements (synthetic data). One row per policy movement. Types: ALTA (new policy), SUPLEMENTO (endorsement), ANULACION (cancellation), REHABILITACION (reinstatement)"
      - name: mov_siniestros
        description: "Daily batches of generated claim movements (synthetic data). One row per claim movement. Types: APERTURA (open claim), AJUSTE_RESERVA (reserve adjustament), PAGO (payment), CIERRE (claim closed)"
    config:
      freshness:
        warn_after: {count: 27, period: hour}
        error_after: {count: 31, period: hour}
      loaded_at_field: _loaded_at


