version: 2

models:
  - name: fct_pagos
    columns:
      - name: movimiento_id
        data_tests: [unique, not_null]
      - name: poliza_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_poliza')
                field: poliza_id
      - name: pago
        data_tests: [no_negativo]